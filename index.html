  <style>
    :root {
      --acid: #8dff3d;
      --deep-green: #0f321c;
      --void: #020503;
      --muted: #4a7652;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 100%;
      font-family: "Space Mono", monospace;
      overflow-x: hidden;
    }

    .system-screen {
      position: relative;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      isolation: isolate;
      overflow: hidden;
    }

    .system-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(141, 255, 61, 0.055) 0,
          rgba(141, 255, 61, 0.055) 1px,
          transparent 1px,
          transparent 5px
        );
      mix-blend-mode: screen;
      animation: scan 8s linear infinite;
    }

    .system-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: 0.46;
      background-image:
        linear-gradient(rgba(141, 255, 61, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(141, 255, 61, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 5%, transparent 78%);
    }

    .boot-line {
      animation: bootIn 700ms ease both;
    }

    .boot-delay-1 { animation-delay: 130ms; }
    .boot-delay-2 { animation-delay: 260ms; }
    .boot-delay-3 { animation-delay: 390ms; }
    .boot-delay-4 { animation-delay: 520ms; }

    .status-dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 999px;
      background: var(--acid);
      box-shadow: 0 0 12px var(--acid);
      animation: pulseDot 1.4s ease-in-out infinite;
    }

    .fault-dot {
      background: #e8ff70;
      box-shadow: 0 0 12px #e8ff70;
    }

    .error-code {
      position: relative;
      color: var(--acid);
      text-shadow:
        3px 0 rgba(168, 255, 121, 0.42),
        -3px 0 rgba(32, 155, 79, 0.45),
        0 0 24px rgba(141, 255, 61, 0.65);
      animation: codeFlicker 4s steps(1) infinite;
    }

    .error-code::after {
      content: "404";
      position: absolute;
      inset: 0;
      opacity: 0.22;
      color: #d6ffb7;
      transform: translate(-4px, 2px);
      clip-path: inset(42% 0 35% 0);
      animation: glitchShift 2.8s steps(2) infinite;
    }

    .glitch-label {
      text-shadow: 2px 0 #153e23, -1px 0 #c2ff8a;
      animation: textGlitch 5s steps(2) infinite;
    }

    .http-warning {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      border: 1px solid rgba(232, 255, 112, 0.5);
      color: #e8ff70;
      background: rgba(232, 255, 112, 0.07);
      box-shadow: 0 0 18px rgba(232, 255, 112, 0.12);
      animation: warningPulse 1.8s ease-in-out infinite;
    }

    .http-warning-icon {
      animation: warningBlink 1.15s steps(2) infinite;
    }

    .diagnostic-panel {
      border: 1px solid rgba(141, 255, 61, 0.32);
      box-shadow: inset 0 0 35px rgba(24, 89, 38, 0.18), 0 0 35px rgba(22, 104, 43, 0.08);
      background: rgba(4, 16, 8, 0.75);
    }

    .terminal-line::before {
      content: ">";
      color: var(--acid);
      margin-right: 0.6rem;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.1em;
      vertical-align: -0.18em;
      background: var(--acid);
      box-shadow: 0 0 10px var(--acid);
      animation: blink 820ms steps(1) infinite;
    }

    .recover-button {
      box-shadow: 0 0 0 1px rgba(141,255,61,0.55), 0 0 24px rgba(141,255,61,0.16);
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    .recover-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
      box-shadow: 0 0 0 1px var(--acid), 0 0 34px rgba(141,255,61,0.3);
    }

    .recover-button:focus-visible {
      outline: 3px solid #e8ff70;
      outline-offset: 4px;
    }

    .restored-sequence {
      animation: restoredIn 460ms ease both;
    }

    .is-restored .status-dot {
      background: #8dff3d;
      box-shadow: 0 0 12px #8dff3d;
    }

    @keyframes scan {
      from { transform: translateY(-10px); }
      to { transform: translateY(10px); }
    }

    @keyframes bootIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseDot {
      50% { opacity: 0.28; transform: scale(0.72); }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes codeFlicker {
      0%, 90%, 100% { opacity: 1; }
      91% { opacity: 0.66; }
      92% { opacity: 1; }
      94% { opacity: 0.82; }
    }

    @keyframes glitchShift {
      0%, 82%, 100% { transform: translate(-4px, 2px); clip-path: inset(42% 0 35% 0); }
      84% { transform: translate(7px, -3px); clip-path: inset(12% 0 67% 0); }
      87% { transform: translate(-8px, 3px); clip-path: inset(70% 0 10% 0); }
    }

    @keyframes textGlitch {
      0%, 87%, 100% { transform: translate(0); }
      89% { transform: translate(-2px, 1px); }
      91% { transform: translate(2px, -1px); }
      93% { transform: translate(0); }
    }

    @keyframes warningPulse {
      0%, 100% { opacity: 0.72; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(4px); }
    }

    @keyframes warningBlink {
      0%, 38%, 100% { opacity: 1; }
      39%, 44% { opacity: 0.25; }
    }

    @keyframes restoredIn {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

  <script src="/_sdk/b734a45e60e3c20c.editing_sdk.js" integrity="sha512-kpJ9bUO4jCpmh+BAXwtHIbXfmgZA27VuEZXTWu6TKDzOyQ5ZV/O4BUWISXqmtjjmNUGf5mAIT+uxslwWjRuDBA=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const recoveryButton = document.getElementById("recovery-button");
      const restoredState = document.getElementById("restored-state");
      const systemState = document.getElementById("system-state");
      const pageRoot = document.body;

      recoveryButton.addEventListener("click", () => {
        recoveryButton.classList.add("hidden");
        restoredState.classList.remove("hidden");
        restoredState.classList.add("flex");
        pageRoot.classList.add("is-restored");
        systemState.classList.add("text-[#8dff3d]");
      });
    });
  </script>
